name: Validate JTBD Skills Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Validate YAML Syntax Across Repository
        run: |
          python -c "
          import glob, yaml, sys
          yaml_files = glob.glob('**/*.yaml', recursive=True) + glob.glob('**/*.yml', recursive=True)
          for file in yaml_files:
              with open(file, 'r', encoding='utf-8') as f:
                  try:
                      yaml.safe_load(f)
                      print(f'OK: {file}')
                  except Exception as e:
                      print(f'ERROR in {file}: {e}')
                      sys.exit(1)
          "

      - name: Validate JSON Syntax Across Repository
        run: |
          python -c "
          import glob, json, sys
          json_files = glob.glob('**/*.json', recursive=True)
          for file in json_files:
              with open(file, 'r', encoding='utf-8') as f:
                  try:
                      json.load(f)
                      print(f'OK: {file}')
                  except Exception as e:
                      print(f'ERROR in {file}: {e}')
                      sys.exit(1)
          "

      - name: Test Quantitative Golden Path Fixture (Ulwick ODI Path)
        run: |
          python3 skills/jtbd-opportunity-calculator/scripts/calculate_opportunity.py integration/project-status-update/04-survey-input.json > /tmp/calculated_out.json
          diff -u /tmp/calculated_out.json integration/project-status-update/05-opportunity-results.json
          echo "Quantitative Golden Path Fixture Output Matches Deterministic Script Execution!"

      - name: Validate Qualitative Golden Path Traceability (Christensen Path)
        run: |
          python -c "
          import yaml, sys
          with open('integration/spreadsheet-to-reporting-service/01-context-analysis.yaml', 'r') as f:
              ctx = yaml.safe_load(f)
          with open('integration/spreadsheet-to-reporting-service/02-four-forces-analysis.yaml', 'r') as f:
              forces = yaml.safe_load(f)
          
          assert ctx['analysis_status'] == 'evidence_extracted', 'Invalid context status'
          assert forces['analysis_status'] == 'evidence_extracted', 'Invalid forces status'
          assert len(forces['forces']['push']) > 0, 'Missing push force'
          assert len(forces['forces']['pull']) > 0, 'Missing pull force'
          assert len(forces['forces']['habit']) > 0, 'Missing habit force'
          assert len(forces['forces']['anxiety']) > 0, 'Missing anxiety force'
          assert forces['switching_readiness']['status'] == 'hypothesis_available', 'Readiness must be hypothesis'
          print('Qualitative Golden Path Traceability Validated!')
          "
