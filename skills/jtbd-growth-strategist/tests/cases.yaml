version: 0.1

cases:
  - id: evidence-aligned-differentiated-strategy
    input:
      opportunity_analysis:
        data_quality_status: complete
        calculation_status: completed
        methodological_assessment:
          sample_size_status: adequate
          representativeness: unverified
          collection_method_status: reported
        results:
          - id: "O1"
            statement: "Minimize the time it takes to verify the completeness of status information"
            opportunity_score: 15.0
            classification: extreme_underserved
      segment_definition:
        name: "Enterprise PMs"
        evidence: ["Formal survey of 250 enterprise project managers"]
        sample_size: 250
      market_context:
        current_alternatives: ["Manual spreadsheets", "Basic task boards"]
        price_evidence:
          - claim: "Enterprise PMs report $50/user/month willingness to pay for complete verification."
            source_type: stated_preference_survey
            sample_size: 250
            limitations: ["Stated preference may not predict actual purchase behavior."]
        cost_evidence: []
        performance_evidence:
          - claim: "Automated verification reduced check time by 80%."
            source_type: controlled_user_test
            sample_size: 40
            baseline: "manual verification"
            limitations: []
        constraint_evidence: []
        nonconsumption_evidence: []
      strategy_constraints:
        target_price_position: premium
        target_performance_position: superior
    expected:
      strategy_assessment_status: evidence_aligned
      candidate_strategies_contains:
        - strategy: differentiated
          confidence: high
      excluded_strategies_contains:
        - strategy: disruptive

  - id: hypothesis-only-small-sample
    input:
      opportunity_analysis:
        data_quality_status: complete
        calculation_status: completed
        methodological_assessment:
          sample_size_status: small
          representativeness: unverified
          collection_method_status: missing
        data_limitations:
          - "Sample size N = 15 (< 100); results represent exploratory hypotheses."
        results:
          - id: "O1"
            statement: "Minimize the time it takes to verify status information"
            opportunity_score: 13.0
            classification: high_underserved
      segment_definition:
        name: "Internal PM team"
        sample_size: 15
      market_context:
        current_alternatives: ["Spreadsheets"]
        price_evidence: []
        cost_evidence: []
        performance_evidence: []
        constraint_evidence: []
      strategy_constraints:
        target_price_position: unknown
        target_performance_position: superior
    expected:
      strategy_assessment_status: hypothesis_only
      candidate_strategies_labeled_as_hypotheses: true
      evidence_gaps_contains:
        - "sample size"

  - id: insufficient-evidence-missing-price-performance
    input:
      opportunity_analysis:
        data_quality_status: complete
        calculation_status: completed
        methodological_assessment:
          sample_size_status: adequate
          representativeness: unverified
          collection_method_status: reported
        results:
          - id: "O1"
            statement: "Minimize the effort required to format updates"
            opportunity_score: 6.0
            classification: overserved_candidate
            overserved_signal: true
      segment_definition:
        name: "Small business PMs"
        sample_size: 120
      market_context:
        current_alternatives: []
        price_evidence: []
        cost_evidence: []
        performance_evidence: []
        constraint_evidence: []
      strategy_constraints:
        target_price_position: unknown
        target_performance_position: unknown
    expected:
      strategy_assessment_status: insufficient_evidence
      evidence_gaps_contains:
        - "price evidence"
        - "performance position"
      must_not_recommend_single_strategy: true

  - id: reject-disruptive-when-underserved-dominates
    input:
      opportunity_analysis:
        data_quality_status: complete
        calculation_status: completed
        methodological_assessment:
          sample_size_status: adequate
          representativeness: unverified
          collection_method_status: reported
        results:
          - id: "O1"
            statement: "Minimize the time it takes to verify information"
            opportunity_score: 16.0
            classification: extreme_underserved
      segment_definition:
        name: "Mainstream PMs"
        sample_size: 200
      market_context:
        price_evidence:
          - claim: "Customers willing to pay premium for speed"
            source_type: customer_interview
        cost_evidence: []
        performance_evidence: []
        constraint_evidence: []
      strategy_constraints:
        target_price_position: low_cost
    expected:
      excluded_strategies_contains:
        - strategy: disruptive
          reason_contains: "extreme underserved outcome dominates"

  - id: allow-discrete-strategy-with-contextual-evidence
    input:
      opportunity_analysis:
        data_quality_status: complete
        calculation_status: completed
        methodological_assessment:
          sample_size_status: adequate
          representativeness: unverified
          collection_method_status: reported
        results:
          - id: "O1"
            statement: "Minimize the likelihood of data leakage during status verification"
            opportunity_score: 15.0
            classification: extreme_underserved
      segment_definition:
        name: "Defense & National Security PMs"
        evidence:
          - "Classified air-gapped network security compliance constraint"
          - "Defense PMs rank data leakage prevention as Opp=15.0 vs mainstream Opp=4.0"
        sample_size: 110
      market_context:
        current_alternatives: ["Air-gapped manual paper logs"]
        price_evidence: []
        cost_evidence: []
        constraint_evidence:
          - claim: "Defense PMs require self-hosted offline deployment."
            source_type: customer_interview
            sample_size: 18
            limitations: []
        performance_evidence:
          - claim: "Zero-network verification reduced compliance audit failures."
            source_type: field_observation
            sample_size: 12
            baseline: "air-gapped manual paper logs"
            limitations:
              - "Observational comparison; not a controlled study."
        nonconsumption_evidence: ["Cloud-only status tools are banned by regulation."]
      strategy_constraints:
        target_price_position: parity
        target_performance_position: superior
    expected:
      strategy_assessment_status: evidence_aligned
      candidate_strategies_contains:
        - strategy: discrete
          confidence: high
          prerequisite_conditions_contains: "distinct outcome priorities"
