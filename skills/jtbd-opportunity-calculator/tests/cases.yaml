version: 0.1

cases:
  - id: standard-opportunity-calculation
    input:
      survey_metadata:
        importance_scale: "1_to_10"
        satisfaction_scale: "1_to_10"
        sample_size: 250
        population_definition: "US Project Managers"
        collection_method: "Online quantitative survey"
      outcomes:
        - id: "O1"
          statement: "Minimize the time it takes to verify the completeness of status information"
          importance_mean: 9.2
          satisfaction_mean: 3.4
        - id: "O2"
          statement: "Minimize the effort required to format status updates"
          importance_mean: 6.0
          satisfaction_mean: 7.5
    expected:
      data_quality_status: complete
      calculation_status: completed
      methodological_assessment:
        sample_size_status: adequate
        representativeness: unverified
        collection_method_status: reported
      results:
        - id: "O1"
          satisfaction_gap: 5.8
          satisfaction_relation: below_importance
          opportunity_score: 15.0
          classification: extreme_underserved
          overserved_signal: false
        - id: "O2"
          satisfaction_gap: 0.0
          satisfaction_relation: above_importance
          opportunity_score: 6.0
          classification: overserved_candidate
          overserved_signal: true

  - id: high-importance-high-satisfaction-not-overserved
    input:
      survey_metadata:
        importance_scale: "1_to_10"
        satisfaction_scale: "1_to_10"
        sample_size: 150
        population_definition: "Senior PMs"
        collection_method: "Survey"
      outcomes:
        - id: "O1"
          statement: "Minimize the likelihood of omitting required status details"
          importance_mean: 9.0
          satisfaction_mean: 9.5
    expected:
      data_quality_status: complete
      results:
        - id: "O1"
          satisfaction_gap: 0.0
          satisfaction_relation: above_importance
          opportunity_score: 9.0
          classification: appropriately_served
          overserved_signal: false

  - id: reject-out-of-bounds-ratings
    input:
      survey_metadata:
        importance_scale: "1_to_10"
        satisfaction_scale: "1_to_10"
        sample_size: 100
        population_definition: "Test population"
        collection_method: "Survey"
      outcomes:
        - id: "O1"
          statement: "Minimize the time it takes to verify information"
          importance_mean: 11.0
          satisfaction_mean: 4.0
    expected:
      data_quality_status: invalid
      calculation_status: blocked
      data_limitations_contains:
        - "Out-of-bounds rating"

  - id: reject-text-guessing
    input:
      survey_metadata:
        importance_scale: "1_to_10"
        satisfaction_scale: "1_to_10"
        sample_size: 0
      text_feedback: "Project managers hate waiting for status info and feel it's extremely important."
    expected:
      data_quality_status: incomplete
      calculation_status: blocked
      must_not_invent_ratings: true
      data_limitations_contains:
        - "Qualitative text feedback was not converted into numerical ratings"

  - id: scale-mismatch-rejection
    input:
      survey_metadata:
        importance_scale: "1_to_5"
        satisfaction_scale: "1_to_10"
        sample_size: 150
      outcomes:
        - id: "O1"
          statement: "Minimize the time it takes to locate status information"
          importance_mean: 4.5
          satisfaction_mean: 5.0
    expected:
      data_quality_status: invalid
      calculation_status: blocked
      must_flag_scale_mismatch: true

  - id: flag-exploratory-small-sample
    input:
      survey_metadata:
        importance_scale: "1_to_10"
        satisfaction_scale: "1_to_10"
        sample_size: 15
        population_definition: "Internal PM team"
        collection_method: ""
      outcomes:
        - id: "O1"
          statement: "Minimize the time it takes to locate status information"
          importance_mean: 8.0
          satisfaction_mean: 5.0
    expected:
      data_quality_status: complete
      calculation_status: completed
      methodological_assessment:
        sample_size_status: small
        collection_method_status: missing
      data_limitations_contains:
        - "Sample size N = 15 (< 100)"
        - "Collection method missing"
