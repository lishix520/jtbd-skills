version: 0.1

cases:
  - id: reject-solution-contaminated-job
    input:
      core_functional_job: "Use an AI dashboard to track project status"
      job_executor: "Project manager"
    expected:
      job_status: rejected
      excluded_classification_contains:
        - solution

  - id: stop-when-executor-unknown
    input:
      core_functional_job: "Prepare a project status update"
      job_executor: null
    expected:
      map_status: insufficient_input
      evidence_gaps_contains:
        - job executor
      must_not_generate_stages: true

  - id: no-forced-eight-stage-map
    input:
      core_functional_job: "Set a kitchen timer"
      job_executor: "Home cook"
      evidence:
        - "The cook decides the duration and starts the timer."
    expected:
      stages_must_include:
        - define
        - execute
      flow_must_include_edges:
        - from: define
          to: execute
      stages_may_be_not_applicable_or_unknown:
        - locate
        - prepare
        - confirm
        - monitor
        - modify
        - conclude
      must_not_invent_steps: true

  - id: separate-solution-from-map-step
    input:
      core_functional_job: "Prepare a project status update"
      job_executor: "Project manager"
      candidate_steps:
        - "Open the Jira dashboard"
        - "Collect project status information"
        - "Write the update in Notion"
    expected:
      excluded_classification_contains:
        - solution
      accepted_step_contains:
        - "Collect project status information"
      must_not_include_terms:
        - Jira
        - Notion

  - id: preserve-loop
    input:
      core_functional_job: "Cut wood"
      job_executor: "Carpenter"
      evidence:
        - "The carpenter checks the cut, adjusts the material when needed, and repeats the cut."
    expected:
      stages_must_include:
        - execute
        - monitor
        - modify
      flow_must_include_edges:
        - from: execute
          to: monitor
        - from: monitor
          to: modify
        - from: modify
          to: execute

  - id: reject-lifecycle-activity
    input:
      core_functional_job: "Prepare a project status update"
      job_executor: "Project manager"
      candidate_steps:
        - "Install reporting software"
    expected:
      excluded_classification_contains:
        - lifecycle_activity
